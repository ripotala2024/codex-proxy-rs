name: protocol-bridge

on:
  pull_request:
    paths:
      - "examples/protocol-bridge/**"
      - ".github/workflows/protocol-bridge.yml"
  push:
    branches:
      - "feat/protocol-bridge-plugin"
    paths:
      - "examples/protocol-bridge/**"
      - ".github/workflows/protocol-bridge.yml"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/protocol-bridge/backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format bridge core
        run: cargo fmt --manifest-path bridge-core/Cargo.toml -- --check
      - name: Format plugin
        run: cargo fmt --manifest-path Cargo.toml -- --check
      - name: Test
        run: cargo test --manifest-path Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path Cargo.toml --all-targets -- -D warnings
